# 日志配置
logger:
  level: "debug"              # 日志级别: debug, info, warn, error
  filename: "./logger/app.logger"  # 日志存储路径
  max_size: 100               # 每个日志文件最大 100MB
  max_backups: 5              # 保留最近 5 个日志文件
  max_age: 30                 # 日志保留 30 天
  compress: true              # 是否压缩旧日志
  show_line: true             # 是否在日志中显示代码行号

  # Redis 配置
redis:
  host: "compemanage-redis"   # Redis 主机地址（本地通过 .env 覆盖为 localhost）
  port: 6379                 # Redis 端口
  password: ""                # Redis 密码（如果有）
  db: 0                       # Redis 数据库编号
  max_retries: 3              # 最大重试次数
  pool_size: 10               # 连接池大小

# 学校数据中台 API 配置
datahall:
  key: "2026051118227ee8fb684d1211f18e4a0a3e580ef7931655"        # 在数据中台获取的 App Key（本科生和教职工共用）
  secret: "bd6d57fc3e95940c974fb7b37c9ff4d0fe6a7911"  # 在数据中台获取的 App Secret（本科生和教职工共用）
  base_url: "https://datahall.gzhu.edu.cn"
