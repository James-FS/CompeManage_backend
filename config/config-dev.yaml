# 日志配置
logger:
  level: "debug"              # 日志级别: debug, info, warn, error
  filename: "./logger/app.logger"  # 日志存储路径
  max_size: 100               # 每个日志文件最大 100MB
  max_backups: 5              # 保留最近 5 个日志文件
  max_age: 30                 # 日志保留 30 天
  compress: true              # 是否压缩旧日志
  show_line: true             # 是否在日志中显示代码行号

  # Redis 配置
redis:
  host: "127.0.0.1"   # Redis 主机地址（本地通过 .env 覆盖为 localhost）
  port: 6379                 # Redis 端口
  password: ""                # Redis 密码（如果有）
  db: 0                       # Redis 数据库编号
  max_retries: 3              # 最大重试次数
  pool_size: 10               # 连接池大小

# 学校数据中台 API 配置
datahall:
  enabled: false             # 演示/本地默认关闭，避免拉取真实学生与教职工数据
  key: ""                    # 使用 DATAHALL_KEY 环境变量覆盖
  secret: ""                 # 使用 DATAHALL_SECRET 环境变量覆盖
  base_url: "https://datahall.gzhu.edu.cn"
  min_grade: "2022"          # 只同步此年级及之后的学生，为空则全量同步

# CAS/OAuth2.0 融合门户统一认证
cas:
  server_url: "https://newcas.gzhu.edu.cn/cas"
  client_id: ""
  client_secret: ""
  redirect_uri: "http://localhost:8080/api/cas/callback"
  frontend_url: "http://localhost:5219"

database:
  host: "compemanage_mysql"   # 数据库主机地址（本地通过 .env 覆盖为 localhost）
  port: 3306
  user: "root"
  password: "123456"
  dbname: "CompeManage"
